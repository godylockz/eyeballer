<!DOCTYPE HTML>
<meta charset="utf-8"/>
<html>
<title>Eyeballer Results</title>
<body>
    <div id="btnsCont">
      <div class="filter-row">
      <span class="toolbar-label" title="Screenshots must carry every selected label">Labels</span>
      <button type="button" class="chip" data-tag="custom404" aria-pressed="false">404</button>
      <button type="button" class="chip" data-tag="login" aria-pressed="false">Login</button>
      <button type="button" class="chip" data-tag="webapp" aria-pressed="false">Web Application</button>
      <button type="button" class="chip" data-tag="oldlooking" aria-pressed="false">Old Looking</button>
      <button type="button" class="chip" data-tag="parked" aria-pressed="false">Parked Domain</button>
      <button type="button" id="clearBtn" disabled>Clear</button>
      <label class="perpage">Per page
        <select id="perPage">
          <option value="25">25</option>
          <option value="50">50</option>
          <option value="100" selected>100</option>
          <option value="250">250</option>
        </select>
      </label>
      </div>
      <div class="filter-row" id="deviceRow" hidden>
        <span class="toolbar-label" title="Device type from the gowitness page title; screenshots may match any selected type">Device</span>
      </div>
      <div id="status"></div>
    </div>
    <div id="btnsPage">
    </div>
    <div id="container">
    </div>
    <button onclick="topFunction()" id="topBtn" title="Go to top">Top</button>
<script>
    var results = {{jsResults | tojson}};
    var pages = {{pages | tojson}};
    var deviceTypes = {{deviceTypes | tojson}}.concat('Unidentified');
    var selectedTags = [];
    var selectedDevices = [];
    var deviceRow = document.getElementById('deviceRow');
    var clearBtn = document.getElementById('clearBtn');
    var perPage = document.getElementById('perPage');
    var numOnPage = parseInt(perPage.value, 10);
    var indexesToDisplay = [];
    var tagCounts = {};
    for (var filename in results) {
        results[filename].forEach(function (tag) { tagCounts[tag] = (tagCounts[tag] || 0) + 1; });
    }
    var deviceCounts = {};
    for (var filename in pages) {
        var device = deviceOf(filename);
        deviceCounts[device] = (deviceCounts[device] || 0) + 1;
    }
    deviceTypes.forEach(function (device) {
        if (!deviceCounts[device]) return;
        var chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'chip';
        chip.dataset.device = device;
        chip.textContent = device;
        deviceRow.append(chip);
        deviceRow.hidden = false;
    });
    var chips = document.querySelectorAll('#btnsCont .chip');
    chips.forEach(function (chip) {
        var count = document.createElement('span');
        count.className = 'count';
        count.textContent = chip.dataset.tag ? (tagCounts[chip.dataset.tag] || 0) : deviceCounts[chip.dataset.device];
        chip.append(count);
        chip.addEventListener('click', function () {
            if (chip.dataset.tag) toggle(selectedTags, chip.dataset.tag);
            else toggle(selectedDevices, chip.dataset.device);
            filterSelection();
        });
    });
    clearBtn.addEventListener('click', function () {
        selectedTags = [];
        selectedDevices = [];
        filterSelection();
    });
    perPage.addEventListener('change', function () {
        numOnPage = parseInt(perPage.value, 10);
        filterSelection();
    });
    filterSelection();
    function deviceOf(filename) {
        return (pages[filename] && pages[filename].device) || 'Unidentified';
    }
    function toggle(list, value) {
        var position = list.indexOf(value);
        if (position === -1) list.push(value);
        else list.splice(position, 1);
    }
    function filterSelection() {
        indexesToDisplay = [];
        var currentIndex = -1;
        for (var filename in results){
                currentIndex++;
                var tags = results[filename];
                var isMissingTag = false;
                for (var i in selectedTags){
                    if (!tags.includes(selectedTags[i])){
                        isMissingTag = true;
                        break;
                    }
                }
                if (selectedDevices.length && !selectedDevices.includes(deviceOf(filename))){
                    isMissingTag = true;
                }
                if (isMissingTag === false){
                    indexesToDisplay = indexesToDisplay.concat(currentIndex);
                }
            }
        chips.forEach(function (chip) {
            var on = selectedTags.includes(chip.dataset.tag) || selectedDevices.includes(chip.dataset.device);
            chip.setAttribute('aria-pressed', on ? 'true' : 'false');
        });
        var filtering = selectedTags.length + selectedDevices.length > 0;
        clearBtn.disabled = !filtering;
        var total = Object.keys(results).length;
        var status = indexesToDisplay.length + ' of ' + total + ' screenshots';
        if (filtering) status += ' match the selected filters';
        document.getElementById('status').textContent = status;
        buildPageButtons(indexesToDisplay);
        buildHTML(0, numOnPage);
        var firstPage = document.querySelector('.btnpage');
        if (firstPage) activatePage(firstPage);
    }
    function buildPageButtons(indexes){
        numOfPages = Math.ceil(indexes.length/numOnPage);
        var html = '';
        for (var i = 0; i < numOfPages; i++){
            html += ('<button class="btnpage" onclick="buildHTML(' + (i*numOnPage) + ', ' + ((i+1)*numOnPage) + '); activatePage(this);">' + (i+1) +'</button>');
        }
        document.getElementById('btnsPage').innerHTML = html;
    }
    function activatePage(pressedBtn){
        var activeNow = document.getElementsByClassName('activePage')
        for (var i = 0; i < activeNow.length; i++){
            activeNow[i].className = activeNow[i].className.replace(" activePage", "");
        }
        pressedBtn.className += ' activePage';
    }
    function buildHTML(rangeMin, rangeMax){
        var container = document.getElementById('container');
        container.replaceChildren();
        if (rangeMax > indexesToDisplay.length) rangeMax=indexesToDisplay.length;
        for (var i = rangeMin; i < rangeMax; i++){
            index=indexesToDisplay[i];
            filename = Object.keys(results)[index];
            var card = document.createElement('div');
            card.className = 'filterDiv';
            var link = document.createElement('a');
            link.href = filename;
            link.target = '_blank';
            link.rel = 'noopener';
            link.textContent = results[filename].join(' ') || 'Unclassified';
            var image = document.createElement('img');
            image.className = 'res_pic';
            image.src = filename;
            card.append(link);
            if (pages[filename]) {
                var caption = document.createElement('div');
                caption.className = 'caption';
                caption.textContent = [pages[filename].device, pages[filename].title].filter(Boolean).join(' · ') || 'No page title';
                caption.title = caption.textContent;
                card.append(caption);
            }
            card.append(image);
            container.append(card);
        }
    }
    window.onscroll = function() {scrollFunction()};
    function scrollFunction() {
      if (document.body.scrollTop > 20 || document.documentElement.scrollTop > 20) {
        document.getElementById("topBtn").style.display = "block";
      } else {
        document.getElementById("topBtn").style.display = "none";
      }
    }
    function topFunction() {
      document.body.scrollTop = 0; // For Safari
      document.documentElement.scrollTop = 0; // For Chrome, Firefox, IE and Opera
    }
</script>
    <style>
    #topBtn {
      display: none; /* Hidden by default */
      position: fixed; /* Fixed/sticky position */
      bottom: 20px; /* Place the button at the bottom of the page */
      right: 30px; /* Place the button 30px from the right */
      z-index: 99; /* Make sure it does not overlap */
      border: none; /* Remove borders */
      outline: none; /* Remove outline */
      background-color: #193b72; /* Set a background color */
      color: white; /* Text color */
      cursor: pointer; /* Add a mouse pointer on hover */
      padding: 15px; /* Some padding */
      border-radius: 10px; /* Rounded corners */
      font-size: 18px; /* Increase font size */
      font-weight:bold;
      border:solid;
    }
    #topBtn:hover {
      background-color: #555;
    }
    .container {
    overflow: hidden;
    }
    #btnsPage {
    margin:10px;
    }
    .btnpage{
        min-width:40px;
        height:30px;
        margin-right:4px;
        border: 1px solid #9aa5b8;
        border-radius: 4px;
        background-color: #fff;
        cursor: pointer;
    }
    .res_pic{
    width:100%;
    height:auto;
    }
    a{
    font-weight:600;
    padding:3px;
    text-decoration: none;
    color:#ffffff;
    font-size:16px;
    font-family:Sans-serif;
    }
    .name{
    float:left;
    }
    .filterDiv {
      float: left;
      background-color: #777;
      color: #ffffff;
      width: 22%;
      border-style:solid;
      border-color:#666;
      text-align: center;
      margin: 10px;
      line-height: 30px;
      display: block;
    }
    body {
      font-family: Sans-serif;
    }
    #btnsCont {
      padding: 12px 10px;
      border-bottom: 1px solid #ccc;
    }
    .filter-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .filter-row[hidden] {
      display: none;
    }
    .toolbar-label {
      min-width: 60px;
      font-weight: 600;
      color: #444;
    }
    .caption {
      padding: 0 8px;
      background-color: #5d5d5d;
      font-size: 13px;
      line-height: 24px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px 7px 10px;
      border: 1px solid #9aa5b8;
      border-radius: 999px;
      background-color: #fff;
      color: #193b72;
      font-size: 14px;
      cursor: pointer;
    }
    /* Empty circle when off, filled check when on, so state reads without relying on colour alone. */
    .chip::before {
      content: "";
      width: 14px;
      height: 14px;
      border: 2px solid #9aa5b8;
      border-radius: 50%;
      box-sizing: border-box;
      font-size: 11px;
      line-height: 10px;
      text-align: center;
    }
    .chip:hover {
      border-color: #193b72;
      background-color: #eef2f9;
    }
    .chip[aria-pressed="true"] {
      background-color: #193b72;
      border-color: #193b72;
      color: #fff;
    }
    .chip[aria-pressed="true"]::before {
      content: "\2713";
      border-color: #fff;
      background-color: #fff;
      color: #193b72;
      font-weight: 700;
    }
    .chip:focus-visible, #clearBtn:focus-visible, .btnpage:focus-visible, #perPage:focus-visible {
      outline: 2px solid #f0a020;
      outline-offset: 2px;
    }
    .count {
      min-width: 20px;
      padding: 1px 6px;
      border-radius: 999px;
      background-color: #e3e8f0;
      color: #333;
      font-size: 12px;
      font-weight: 600;
    }
    .chip[aria-pressed="true"] .count {
      background-color: rgba(255, 255, 255, 0.25);
      color: #fff;
    }
    #clearBtn {
      padding: 7px 12px;
      border: none;
      background: none;
      color: #193b72;
      font-size: 14px;
      text-decoration: underline;
      cursor: pointer;
    }
    #clearBtn:disabled {
      color: #aaa;
      text-decoration: none;
      cursor: default;
    }
    .perpage {
      margin-left: auto;
      margin-right: 20px;
      color: #444;
      font-size: 14px;
    }
    #perPage {
      margin-left: 6px;
      height: 30px;
    }
    #status {
      color: #555;
      font-size: 13px;
    }
    .activePage{
        background-color: #193b72;
        border-color: #193b72;
        color: white;
        font-weight: 600;
    }
    </style>
</body>
</html>
